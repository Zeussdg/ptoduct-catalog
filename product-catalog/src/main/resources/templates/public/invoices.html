<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Faturalarım')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="custpg">
  <h1 class="custpg__title">Faturalarım</h1>
  <div class="custpg__card">
    <div th:if="${#lists.isEmpty(invoices)}" class="custpg__empty">Henüz faturanız yok.</div>

    <table th:unless="${#lists.isEmpty(invoices)}" class="custpg__table">
      <thead>
        <tr><th>Fatura No</th><th>Tarih</th><th>Sipariş</th><th>Durum</th><th>Vade</th><th>Tutar</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="inv : ${invoices}">
          <td data-label="Fatura No" th:text="${inv.invoiceNumber}">FTR-2026-0001</td>
          <td data-label="Tarih" th:text="${@fmt.date(inv.issuedAt)}">01.01.2026</td>
          <td data-label="Sipariş" th:text="'#' + ${inv.order.id}">#1</td>
          <td data-label="Durum"><span class="custpg__badge" th:text="${@invoiceStatus.label(inv.status)}">Kesildi</span></td>
          <td data-label="Vade" th:text="${inv.dueDate != null ? @fmt.date(inv.dueDate) : '—'}">—</td>
          <td data-label="Tutar" th:text="${@fmt.invoiceGrandTotal(inv)}">₺0,00</td>
          <td><a class="custpg__link" target="_blank" th:href="@{'/invoices/' + ${inv.id} + '/pdf'}">PDF</a></td>
        </tr>
      </tbody>
    </table>
    <p style="margin:12px 0 0;color:var(--ink-500);font-size:11.5px">
      Fatura numaraları resmi bir e-Fatura/e-Arşiv/GİB numarası değildir, sadece dahili bir referanstır.
    </p>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/cart-drawer :: drawer}"></div>
<script th:src="@{/js/cart.js}"></script>
<script th:src="@{/js/exchange-rate.js}"></script>
</body>
</html>

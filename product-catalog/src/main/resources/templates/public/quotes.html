<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Tekliflerim')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="custpg">
  <h1 class="custpg__title">Tekliflerim</h1>
  <div class="custpg__card">
    <div th:if="${#lists.isEmpty(quotes)}" class="custpg__empty">Henüz teklif talebiniz yok.</div>

    <table th:unless="${#lists.isEmpty(quotes)}" class="custpg__table">
      <thead>
        <tr><th>Teklif No</th><th>Tarih</th><th>Durum</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="q : ${quotes}">
          <td th:text="'#' + ${q.id}">#1</td>
          <td th:text="${@fmt.date(q.createdAt)}">01.01.2026</td>
          <td><span class="custpg__badge" th:text="${@quoteStatus.label(q.status)}">Beklemede</span></td>
          <td><a class="custpg__link" th:href="@{'/quotes/' + ${q.id}}">Detay</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/cart-drawer :: drawer}"></div>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Teklif #' + ${quote.id})}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="custpg">
  <h1 class="custpg__title">
    Teklif <span th:text="'#' + ${quote.id}">#1</span>
    <span class="custpg__badge" th:text="${@quoteStatus.label(quote.status)}">Beklemede</span>
  </h1>

  <p style="margin:0 0 16px">
    <a th:if="${order != null}" class="custpg__btn custpg__btn--success" th:href="@{'/orders/' + ${order.id}}">Siparişi Görüntüle</a>
    <form th:if="${order == null}" method="post" th:action="@{/orders}" style="display:inline"
          onsubmit="return confirm('Bu teklif için sipariş oluşturmak istediğinize emin misiniz?')">
      <input type="hidden" name="quoteId" th:value="${quote.id}"/>
      <button type="submit" class="custpg__btn custpg__btn--success"
              th:disabled="${quote.status.name() != 'ACCEPTED'}"
              th:title="${quote.status.name() != 'ACCEPTED'} ? 'Sadece kabul edilen teklifler siparişe dönüştürülebilir' : ''">
        Sipariş Oluştur</button>
    </form>
  </p>

  <div class="custpg__card">
    <table class="custpg__table">
      <thead>
        <tr><th>Ürün</th><th>Ürün Kodu</th><th>Adet</th><th>Birim Fiyat</th><th>Toplam</th></tr>
      </thead>
      <tbody>
        <tr th:each="item : ${quote.items}">
          <td th:text="${item.productName}">Ürün</td>
          <td class="mono" th:text="${item.productCode}">KOD</td>
          <td th:text="${item.qty}">1</td>
          <td th:text="${@priceFormatter.format(item.unitPrice, item.currency)}">₺0,00</td>
          <td th:text="${@priceFormatter.format(item.totalPrice, item.currency)}">₺0,00</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="custpg__card">
    <form method="post" th:action="@{'/quotes/' + ${quote.id} + '/status'}">
      <label class="custpg__field"><span>Durum</span>
        <select name="status">
          <option th:each="s : ${T(com.ikibm.catalog.entity.QuoteStatus).values()}"
                  th:value="${s}" th:text="${@quoteStatus.label(s)}" th:selected="${quote.status == s}">Beklemede</option>
        </select></label>
      <label class="custpg__field"><span>Notunuz</span>
        <textarea rows="3" name="note" th:text="${quote.note}"></textarea></label>
      <button class="custpg__btn" type="submit">Durumu Güncelle</button>
    </form>
  </div>

  <div class="custpg__card" th:if="${quote.adminNote != null and quote.adminNote != ''}">
    <strong>Admin Notu:</strong>
    <p th:text="${quote.adminNote}">Not</p>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/cart-drawer :: drawer}"></div>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>

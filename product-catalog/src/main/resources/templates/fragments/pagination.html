<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<body>
<!-- Kullanım: th:replace="~{fragments/pagination :: pagination(${currentPage}, ${totalPages}, ${baseQuery})}"
     baseQuery: filtre parametreleri, '&' ile biter ya da boştur (örn. "q=foo&marka=TENDA&"). -->
<nav class="pgn" aria-label="Sayfalama" th:fragment="pagination(current, total, baseQuery)" th:if="${total > 1}">
  <a class="pgn__nav" th:classappend="${current == 1} ? ' pgn__nav--disabled'"
     th:href="${current == 1} ? '#' : ('/?' + baseQuery + 'sayfa=' + (current - 1))"
     aria-label="Önceki sayfa">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Önceki</span>
  </a>

  <ul class="pgn__list">
    <li th:each="it : ${@paginations.items(current, total)}">
      <span th:if="${it == '…'}" class="pgn__gap" aria-hidden="true">…</span>
      <a th:unless="${it == '…'}" class="pgn__page"
         th:classappend="${it == #strings.toString(current)} ? ' pgn__page--active'"
         th:href="${'/?' + baseQuery + 'sayfa=' + it}"
         th:text="${it}">1</a>
    </li>
  </ul>

  <a class="pgn__nav" th:classappend="${current == total} ? ' pgn__nav--disabled'"
     th:href="${current == total} ? '#' : ('/?' + baseQuery + 'sayfa=' + (current + 1))"
     aria-label="Sonraki sayfa">
    <span>Sonraki</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
</nav>
</body>
</html>

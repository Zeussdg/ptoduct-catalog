<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${isEdit} ? 'Ürünü Düzenle' : 'Yeni Ürün')}"></head>
<body>
<div class="adm">
  <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
  <div class="adm__main">
    <div th:replace="~{fragments/admin-sidebar :: topbar}"></div>
    <main class="adm__content">
      <h1 class="adp__title" th:text="${isEdit} ? 'Ürünü Düzenle' : 'Yeni Ürün'">Yeni Ürün</h1>
      <p th:if="${error}" th:text="${error}" style="color:var(--danger-600)">Hata</p>

      <form class="adp__card" method="post" th:object="${form}"
            th:action="${isEdit} ? @{'/admin/products/' + ${product.id}} : @{/admin/products}">
        <div class="adp__form-grid">
          <label class="adp__field"><span>Ürün Adı</span>
            <input type="text" th:field="*{name}"/>
            <small th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:var(--danger-600);font-size:11px">Hata</small></label>
          <label class="adp__field"><span>Ürün Kodu</span>
            <input type="text" th:field="*{stockCode}"/>
            <small th:if="${#fields.hasErrors('stockCode')}" th:errors="*{stockCode}" style="color:var(--danger-600);font-size:11px">Hata</small></label>
          <label class="adp__field"><span>Marka</span>
            <input type="text" th:field="*{brand}"/></label>
          <label class="adp__field"><span>Kategori</span>
            <select th:field="*{categoryId}">
              <option value="">Kategorisiz</option>
              <option th:each="c : ${categories}" th:value="${c.id}"
                      th:text="${#strings.repeat('— ', c.depth) + c.name}">Kategori</option>
            </select></label>
          <label class="adp__field"><span>Fiyat</span>
            <input type="number" step="0.01" th:field="*{price}"/>
            <small th:if="${#fields.hasErrors('price')}" th:errors="*{price}" style="color:var(--danger-600);font-size:11px">Hata</small></label>
          <label class="adp__field"><span>İndirimli Fiyat</span>
            <input type="number" step="0.01" th:field="*{discountPrice}"/>
            <small th:if="${#fields.hasErrors('discountPrice')}" th:errors="*{discountPrice}" style="color:var(--danger-600);font-size:11px">Hata</small></label>
          <label class="adp__field"><span>Para Birimi</span>
            <select th:field="*{currency}">
              <option value="TRY">TRY</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
            </select></label>
          <label class="adp__field"><span>Durum</span>
            <select th:field="*{isActive}">
              <option value="true">Aktif</option>
              <option value="false">Pasif</option>
            </select></label>
        </div>
        <label class="adp__field"><span>Açıklama</span>
          <textarea rows="4" th:field="*{description}"></textarea></label>
        <button class="adp__btn" type="submit">Kaydet</button>
      </form>

      <div class="adp__card" th:if="${isEdit}">
        <h2 style="font-size:15px;margin:0 0 12px">Görseller</h2>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">
          <div th:each="img : ${images}" style="text-align:center">
            <img th:src="${img.url}" alt="" style="width:96px;height:96px;object-fit:cover;border-radius:6px;border:1px solid var(--line-200)"/>
            <div style="display:flex;gap:4px;margin-top:6px;justify-content:center">
              <form method="post" th:action="@{'/admin/products/' + ${product.id} + '/images/' + ${img.id} + '/primary'}" style="margin:0">
                <button type="submit" class="adp__badge" th:classappend="${!img.isPrimary} ? ' adp__badge--muted'"
                        style="border:none;cursor:pointer" th:text="${img.isPrimary ? 'Ana' : 'Ana Yap'}">Ana Yap</button>
              </form>
              <form method="post" th:action="@{'/admin/products/' + ${product.id} + '/images/' + ${img.id} + '/delete'}" style="margin:0">
                <button type="submit" class="adp__badge adp__badge--danger" style="border:none;cursor:pointer">Sil</button>
              </form>
            </div>
          </div>
        </div>
        <form method="post" enctype="multipart/form-data" th:action="@{'/admin/products/' + ${product.id} + '/images'}">
          <input type="file" name="image" accept="image/*" required/>
          <label style="margin-left:8px"><input type="checkbox" name="isPrimary" value="true"/> Birincil yap</label>
          <button class="adp__btn adp__btn--sm" type="submit" style="margin-left:8px">Yükle</button>
        </form>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>

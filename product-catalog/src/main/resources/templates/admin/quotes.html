<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Teklifler')}"></head>
<body>
<div class="adm">
  <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
  <div class="adm__main">
    <div th:replace="~{fragments/admin-sidebar :: topbar}"></div>
    <main class="adm__content">
      <div class="adp__toolbar">
        <div>
          <h1 class="adp__title">Teklifler</h1>
          <p class="adp__subtitle">Tüm müşteri teklif taleplerini görüntüleyin</p>
        </div>
        <form method="get" th:action="@{/admin/quotes}" style="margin:0">
          <select class="adp__select-inline" name="status" onchange="this.form.submit()">
            <option value="" th:selected="${status == null or status == ''}">Tüm durumlar</option>
            <option th:each="s : ${T(com.ikibm.catalog.entity.QuoteStatus).values()}"
                    th:value="${s}" th:text="${s}" th:selected="${status == s.name()}">PENDING</option>
          </select>
        </form>
      </div>

      <div class="adp__card">
        <div th:if="${#lists.isEmpty(quotes)}" class="adp__empty">Teklif bulunamadı.</div>
        <table th:unless="${#lists.isEmpty(quotes)}" class="adp__table">
          <thead><tr><th>Teklif No</th><th>Müşteri</th><th>Ürünler</th><th>Tutar</th><th>Durum</th><th>Tarih</th><th></th></tr></thead>
          <tbody>
            <tr th:each="q : ${quotes}">
              <td th:text="'#' + ${q.id}">#1</td>
              <td th:text="${q.user != null ? (q.user.companyName != null ? q.user.companyName : q.user.email) : (q.recipientCompany != null ? q.recipientCompany : (q.recipientContact != null ? q.recipientContact : 'Misafir'))}">Müşteri</td>
              <td th:text="${#lists.isEmpty(q.items) ? '-' : q.items[0].productName + (q.items.size() > 1 ? (' +' + (q.items.size() - 1) + ' diğer') : '')}">Ürünler</td>
              <td th:text="${@fmt.quoteTotal(q)}">Tutar</td>
              <td><span class="adp__badge" th:text="${@quoteStatus.label(q.status)}">Beklemede</span></td>
              <td th:text="${@fmt.date(q.createdAt)}">01.01.2026</td>
              <td><a class="adp__btn adp__btn--sm adp__btn--ghost" th:href="@{'/admin/quotes/' + ${q.id}}">Detay</a></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>

spring:
  application:
    name: product-catalog

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/urun_katalog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    cache: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}

app:
  seed:
    super-admin-email: ${APP_SEED_SUPER_ADMIN_EMAIL:superadmin@2mbilisim.local}
    super-admin-password: ${APP_SEED_SUPER_ADMIN_PASSWORD:ChangeMe123!}
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}

logging:
  level:
    org.springframework.security: INFO

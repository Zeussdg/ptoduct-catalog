spring:
  application:
    name: product-catalog

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/urun_katalog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    cache: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # "Güncel Kur" widget'ının TCMB'ye giden isteği için — başka hiçbir dış çağrı bu ayarı kullanmıyor.
  http:
    client:
      connect-timeout: ${APP_EXCHANGE_RATE_CONNECT_TIMEOUT:3s}
      read-timeout: ${APP_EXCHANGE_RATE_READ_TIMEOUT:4s}

server:
  port: ${SERVER_PORT:8080}

app:
  seed:
    super-admin-email: ${APP_SEED_SUPER_ADMIN_EMAIL:superadmin@2mbilisim.local}
    super-admin-password: ${APP_SEED_SUPER_ADMIN_PASSWORD:ChangeMe123!}
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}
  # GEÇİCİ ÖRNEK DEĞERLER — gerçek şirket bilgileriyle değiştirilmeli (env var ile override edilebilir).
  company:
    name: ${APP_COMPANY_NAME:2M Bilişim Ltd. Şti.}
    tax-number: ${APP_COMPANY_TAX_NUMBER:1234567890}
    tax-office: ${APP_COMPANY_TAX_OFFICE:Kadıköy Vergi Dairesi}
    address: ${APP_COMPANY_ADDRESS:Örnek Mah. Örnek Cad. No:1 Kadıköy/İstanbul}
    phone: ${APP_COMPANY_PHONE:+90 216 000 00 00}
    email: ${APP_COMPANY_EMAIL:info@2mbilisim.local}
  invoice:
    default-vat-rate: ${APP_INVOICE_DEFAULT_VAT_RATE:20}
  # SADECE header'daki "Güncel Kur" görsel rozeti için — hiçbir hesaplamada kullanılmaz.
  exchange-rate:
    url: ${APP_EXCHANGE_RATE_URL:https://www.tcmb.gov.tr/kurlar/today.xml}
    cache-minutes: ${APP_EXCHANGE_RATE_CACHE_MINUTES:60}
  # Resend (mail gönderme) — api-key KESİNLİKLE burada açık yazılmaz, sadece ortam değişkeninden
  # okunur (varsayılan boş). Uygulamayı başlatırken: RESEND_API_KEY=re_xxx ... java -jar ...
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:noreply@2mbilisim.net}

logging:
  level:
    org.springframework.security: INFO
